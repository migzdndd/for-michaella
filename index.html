<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For Michaella</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zeyada&family=Short+Stack&family=Homemade+Apple&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: none;
      position: fixed;
    }
    body {
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-image: url("images/bg.jpeg");
      background-position: center center;
      background-repeat: no-repeat;
      background-color: #fce4ec;
      font-family: 'Zeyada', cursive;
    }
    .paper {
      background-image: url("images/paper.webp");
      background-size: 500px;
      background-position: center center;
      padding: 20px 80px;
      box-shadow: 1px 15px 20px 0px rgba(0,0,0,0.35);
      position: absolute;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      max-width: 85vw;
      text-align: center;
      will-change: transform;
    }
    .paper:active {
      cursor: grabbing;
    }
    .paper.heart {
      position: relative;
      width: 200px;
      height: 200px;
      padding: 0;
      border-radius: 50%;
    }
    .paper.heart::after {
      content: "";
      background-image: url('images/heart.webp');
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-size: 150px;
      background-position: center center;
      background-repeat: no-repeat;
      opacity: 0.7;
    }
    .paper.image {
      padding: 15px 25px 20px;
      max-width: 85vw;
    }
    .paper.image p {
      font-size: 28px;
      margin: 5px 0 10px;
      line-height: 1.2;
    }
    img {
      max-height: 220px;
      max-width: 100%;
      width: auto;
      border-radius: 6px;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      display: block;
      margin: 0 auto;
    }
    p {
      font-family: 'Zeyada', cursive;
      font-size: 42px;
      color: rgb(0,0,100);
      opacity: 0.85;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      line-height: 1.2;
    }
    p.p1 {
      font-size: 42px;
    }
    p.p2 {
      font-size: 46px;
      color: #c2185b;
    }
    @media (max-width: 600px) {
      .paper {
        padding: 15px 30px;
        max-width: 88vw;
        box-shadow: 1px 10px 15px 0px rgba(0,0,0,0.3);
      }
      .paper.image {
        padding: 12px 16px 16px;
        max-width: 88vw;
      }
      .paper.image p {
        font-size: 22px;
        margin: 4px 0 8px;
      }
      img {
        max-height: 180px;
      }
      p, p.p1 {
        font-size: 30px;
      }
      p.p2 {
        font-size: 34px;
      }
      .paper.heart {
        width: 160px;
        height: 160px;
      }
      .paper.heart::after {
        background-size: 120px;
      }
    }
  </style>
</head>
<body>

<div class="paper heart"></div>

<div class="paper image">
  <p> and I am here to remind you</p>
  <p> That you are God's Masterpiece </p>
  <img src="images/1.jpeg" alt="Michaella" />
</div>

<div class="paper image">
  <p></p>
  <img src="images/2.jpeg" alt="Michaella" />
</div>

<div class="paper image">
  <p> Thank you </p>
  <p> for being my teacher at times </p>
  <img src="images/3.jpeg" alt="Michaella" />
</div>

<div class="paper red">
  <p class="p1"> Thank you for reminding me</p>
  <p class="p2">to put God first</p>
</div>

<div class="paper red">
  <p class="p1"> Thank you for entering</p>
  <p class="p2">my life</p>
</div>

<div class="paper red">
  <p class="p1"> and My Favorite</p>
  <p class="p2">Person</p>
</div>

<div class="paper">
  <p class="p1">You are Cute and</p>
  <p class="p1">Amazing<span style="color: red !important;">❤️</span></p>
</div>

<div class="paper">
  <p class="p1">To: </p>
  <p class="p1">Michaella Rose Clemente</p>
</div>

<script src="script.js"></script>
</body>
</html>
